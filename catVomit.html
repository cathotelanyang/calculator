        }

            max-width: 850px; /* 너비 약간 증가 */

        h1 {
            text-align: center;
            color: #334155; /* Tailwind Slate 700 */
            font-size: 2em; /* 크기 증가 */
            margin-bottom: 30px;
        }
        h2 {

            font-size: 1.6em;
            margin-top: 35px;
            margin-bottom: 20px;
            border-bottom: 3px solid #e2e8f0; /* 테두리 강화 */
            padding-bottom: 10px;
        }
        .vomit-card {
            border: 1px solid #d1d5db; /* 테두리 약간 진하게 */
            border-radius: 8px; /* 부드러운 모서리 */
            margin-bottom: 20px;
            transition: transform 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
            overflow: hidden; /* 애니메이션을 위해 추가 */
        }
        .vomit-card:hover {
            transform: translateY(-4px); /* 호버 시 약간 더 떠오르도록 */

        .vomit-card-header {

            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative; /* 버튼의 active 효과를 위해 */
        }
        .vomit-card-header-title {
            flex-grow: 1;
            margin-right: 15px;
        }
        .header-buttons {
            display: flex;
            align-items: center;
        }

            transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s, color 0.2s;
            margin-left: 8px;
            white-space: nowrap;
        }
        .toggle-button:hover, .copy-all-button:hover {
            transform: scale(1.05); /* 호버 시 약간 확대 */
            /* 호버 시 배경/테두리 색상은 JS에서 동적으로 적용된 색상을 따름 */
        }
        .toggle-button:active, .copy-all-button:active {
            transform: scale(0.97); /* 클릭 시 약간 축소 */
            filter: brightness(0.95); /* 클릭 시 약간 어둡게 */
        }
        .copy-all-button.copied {
            /* JS에서 직접 스타일 변경 */
        }

        .vomit-card-content {
            /* display: none; */ /* JS에서 초기 제어 */
            max-height: 0;
            opacity: 0;
            overflow: hidden;

        .vomit-card-content.open {

        }

            list-style-type: none;
            padding-left: 0;
        }
        .vomit-card-content ul li {
            padding-left: 1.3em;
            text-indent: -1.3em;
            margin-bottom: 6px;
        }
        .vomit-card-content ul li::before {
            content: "–";
            margin-right: 0.6em;
            opacity: 0.8;
        }

            {

            },
            {
                level: "🆘 즉시 병원 권장",
                colors: "🟢 초록색 + 증상 동반<br>🟤 갈색<br>🔴 붉은색<br>⚫️ 검정색<br>🧶 이물 포함",

        // 4. 중요 안내사항 HTML 텍스트

        // --- Helper Functions --- 
        function getCardColors(typeText) {
            let bgColor = '#ECEFF1';     // 기본 카드 배경색 (Blue Gray 50)
            let textColor = '#263238';     // 기본 카드 텍스트 색상 (Blue Gray 900)
            let btnBorderColor = '#B0BEC5'; // 버튼 테두리 색상 (Blue Gray 300)
            let btnHoverBgColor = '#CFD8DC';// 버튼 호버 시 배경색 (Blue Gray 200)
            let contentBorderColor = '#B0BEC5'; // 내용 구분선 색상 (Blue Gray 300)

            // 색상 팔레트: 전체적으로 채도/명도 조정하여 더 진하게
            if (typeText.includes("노란색")) { bgColor = '#FFF9C4'; textColor = '#795548'; btnBorderColor = '#FBC02D'; btnHoverBgColor = '#FFF59D'; contentBorderColor = '#FBC02D';} // Yellow (진하게)
            else if (typeText.includes("초록색")) { bgColor = '#C8E6C9'; textColor = '#2E7D32'; btnBorderColor = '#66BB6A'; btnHoverBgColor = '#A5D6A7'; contentBorderColor = '#66BB6A';} // Green (진하게)
            else if (typeText.includes("흰색") || typeText.includes("맑은 점액")) { bgColor = '#F5F5F5'; textColor = '#424242'; btnBorderColor = '#BDBDBD'; btnHoverBgColor = '#EEEEEE'; contentBorderColor = '#BDBDBD';} // Gray (진하게)
            else if (typeText.includes("갈색")) { bgColor = '#FFE0B2'; textColor = '#6D4C41'; btnBorderColor = '#FFB74D'; btnHoverBgColor = '#FFCC80'; contentBorderColor = '#FFB74D';} // Amber/Brown (진하게)
            else if (typeText.includes("붉은색")) { bgColor = '#FFCDD2'; textColor = '#C62828'; btnBorderColor = '#E57373'; btnHoverBgColor = '#EF9A9A'; contentBorderColor = '#E57373';} // Red (진하게)
            else if (typeText.includes("분홍색")) { bgColor = '#F8BBD0'; textColor = '#AD1457'; btnBorderColor = '#F06292'; btnHoverBgColor = '#F48FB1'; contentBorderColor = '#F06292';} // Pink (진하게)
            else if (typeText.includes("검정색")) { bgColor = '#BDBDBD'; textColor = '#212121'; btnBorderColor = '#757575'; btnHoverBgColor = '#9E9E9E'; contentBorderColor = '#757575';} // Dark Gray/Black (진하게)
            else if (typeText.includes("맑은 액체")) { bgColor = '#BBDEFB'; textColor = '#1565C0'; btnBorderColor = '#64B5F6'; btnHoverBgColor = '#90CAF9'; contentBorderColor = '#64B5F6';} // Blue (진하게)
            else if (typeText.includes("음식물 형태")) { bgColor = '#FFECB3'; textColor = '#795548'; btnBorderColor = '#FFCA28'; btnHoverBgColor = '#FFE082'; contentBorderColor = '#FFCA28';} // Amber (진하게)
            else if (typeText.includes("이물 포함")) { bgColor = '#FFE082'; textColor = '#6D4C41'; btnBorderColor = '#FFB74D'; btnHoverBgColor = '#FFCC80'; contentBorderColor = '#FFB74D'; } // Amber (더 진하게, 주의)
            else if (typeText.includes("보라빛")) { bgColor = '#E1BEE7'; textColor = '#6A1B9A'; btnBorderColor = '#BA68C8'; btnHoverBgColor = '#CE93D8'; contentBorderColor = '#BA68C8';} // Purple (진하게)
            else if (typeText.includes("주황빛")) { bgColor = '#FFCCBC'; textColor = '#D84315'; btnBorderColor = '#FF8A65'; btnHoverBgColor = '#FFAB91'; contentBorderColor = '#FF8A65';} // Orange (진하게)
            
            return { bgColor, textColor, btnBorderColor, btnHoverBgColor, contentBorderColor };
        }
        
        function getRiskClass(level) {
            if (level.includes("경계 필요")) return 'risk-caution';
            if (level.includes("즉시 병원 권장")) return 'risk-urgent';
            if (level.includes("희귀/불명확")) return 'risk-rare';
            return '';
        }

        // --- UI Rendering Functions --- 
        function renderVomitCards() {
            const vomitInfoSection = document.getElementById('vomit-info-section');
            if (!vomitInfoSection) return;

            vomitDetailsData.forEach(info => {
                const card = document.createElement('div');
                card.className = 'vomit-card';
                const colors = getCardColors(info.type);
                card.style.backgroundColor = colors.bgColor;

                const header = document.createElement('div');
                header.className = 'vomit-card-header';
                header.style.color = colors.textColor;

                const headerTitle = document.createElement('span');
                headerTitle.className = 'vomit-card-header-title';
                headerTitle.innerHTML = info.type; 
                
                const headerButtons = document.createElement('div');
                headerButtons.className = 'header-buttons';

                const copyAllBtn = document.createElement('button');
                copyAllBtn.className = 'copy-all-button';
                copyAllBtn.textContent = '전체 복사';
                copyAllBtn.style.color = colors.textColor;
                copyAllBtn.style.borderColor = colors.btnBorderColor;
                copyAllBtn.addEventListener('mouseover', () => { 
                    copyAllBtn.style.backgroundColor = colors.btnHoverBgColor;
                    copyAllBtn.style.borderColor = colors.textColor; // 호버 시 테두리도 텍스트 색상과 동일하게
                });
                copyAllBtn.addEventListener('mouseout', () => { 
                    copyAllBtn.style.backgroundColor = 'rgba(255,255,255,0.2)'; // CSS 기본값으로
                    copyAllBtn.style.borderColor = colors.btnBorderColor;
                });

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'toggle-button';
                toggleBtn.textContent = '더보기';
                toggleBtn.style.color = colors.textColor;
                toggleBtn.style.borderColor = colors.btnBorderColor;
                toggleBtn.addEventListener('mouseover', () => { 
                    toggleBtn.style.backgroundColor = colors.btnHoverBgColor; 
                    toggleBtn.style.borderColor = colors.textColor;
                });
                toggleBtn.addEventListener('mouseout', () => { 
                    toggleBtn.style.backgroundColor = 'rgba(255,255,255,0.2)';
                    toggleBtn.style.borderColor = colors.btnBorderColor;
                });

                headerButtons.appendChild(copyAllBtn);
                headerButtons.appendChild(toggleBtn);

                header.appendChild(headerTitle);
                header.appendChild(headerButtons);
                
                const content = document.createElement('div');
                content.className = 'vomit-card-content';
                content.style.color = colors.textColor; 
                content.innerHTML = `
                    <p><strong style="color:${colors.textColor};
                                     opacity:${colors.textColor === '#212121' ? 0.85 : 1};">주요 원인:</strong><br>${info.cause}</p>
                    <p><strong style="color:${colors.textColor};
                                     opacity:${colors.textColor === '#212121' ? 0.85 : 1};">대처법:</strong><br>${info.action}</p>
                    <p><strong style="color:${colors.textColor};
                                     opacity:${colors.textColor === '#212121' ? 0.85 : 1};">주의사항:</strong><br>${info.precaution}</p>
                `;
                
                card.appendChild(header);
                card.appendChild(content);
                vomitInfoSection.appendChild(card);

                const toggleContent = () => {
                    const isDisplayed = content.classList.contains('open');
                    if (isDisplayed) {
                        content.classList.remove('open');
                        toggleBtn.textContent = '더보기';
                    } else {
                        content.classList.add('open');
                        content.style.borderTopColor = colors.contentBorderColor; // 펼쳐질 때 구분선 색상 설정
                        toggleBtn.textContent = '간략히';
                    }
                };

                header.addEventListener('click', (e) => {
                    if (e.target.closest('.header-buttons')) return;
                    toggleContent();
                });
                
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleContent();
                });

                copyAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const textToCopy = 
`${info.type.replace(/<\/?b>/gi, '')} \n\n` +
`주요 원인:\n${info.cause.replace(/<br\s*\/?>/gi, '\n')}\n\n` +
`대처법:\n${info.action.replace(/<br\s*\/?>/gi, '\n')}\n\n` +
`주의사항:\n${info.precaution.replace(/<br\s*\/?>/gi, '\n')}`;

                    navigator.clipboard.writeText(textToCopy).then(() => {
                        const originalText = copyAllBtn.textContent;
                        copyAllBtn.textContent = '복사 완료!';
                        copyAllBtn.style.backgroundColor = colors.btnHoverBgColor; 
                        copyAllBtn.style.color = colors.bgColor; // 글자색 잠시 반전
                        setTimeout(() => {
                            copyAllBtn.textContent = originalText;
                            copyAllBtn.style.backgroundColor = 'rgba(255,255,255,0.2)'; // 원래대로
                            copyAllBtn.style.color = colors.textColor; // 원래대로
                        }, 1500);
                    }).catch(err => {
                        console.error('전체 복사 실패:', err);
                        alert('클립보드 전체 복사에 실패했습니다. 잠시 후 다시 시도해주세요.');
                    });
                });
            });
        }

        function renderRiskTable() {
            const riskTableBody = document.getElementById('risk-summary-table')?.getElementsByTagName('tbody')[0];
            if (!riskTableBody) return;

            riskInfoData.forEach(risk => {
                const row = riskTableBody.insertRow();
                row.className = getRiskClass(risk.level);
                row.insertCell().innerHTML = risk.level;
                row.insertCell().innerHTML = risk.colors; 
                row.insertCell().innerHTML = risk.description;
            });
        }

        function renderNotice() {
            const noticeContent = document.getElementById('notice-content');
            if (noticeContent) {
                noticeContent.innerHTML = noticeHtmlText;
            }
        }

        // --- Initialize Page --- 
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('main-title').textContent = pageGlobalTitle;
            renderVomitCards();
            renderRiskTable();
            renderNotice();
        });
    </script>
</body>
</html>
