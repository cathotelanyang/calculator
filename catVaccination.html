<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 예방접종 및 기생충 예방 안내</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f0f2f5; 
            color: #333;
            line-height: 1.7;
            word-break: keep-all; 
            overflow-wrap: break-word; 
        }
        .container {
            max-width: 850px; 
            margin: 20px auto; 
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.08); 
        }
        h1 {
            text-align: center;
            color: #334155; 
            font-size: 2em; 
            margin-bottom: 30px;
        }
        h2 {
            color: #1e293b; 
            font-size: 1.6em;
            margin-top: 35px;
            margin-bottom: 20px;
            border-bottom: 3px solid #e2e8f0; 
            padding-bottom: 10px;
        }
        /* 클래스명 변경: vomit-card -> info-card */
        .info-card {
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            margin-bottom: 20px;
            transition: transform 0.25s ease-in-out, box-shadow 0.25s ease-in-out;
            overflow: hidden; 
        }
        .info-card:hover {
            transform: translateY(-4px); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.12); 
        }
        .info-card-header {
            font-weight: 700; 
            font-size: 1.25em; 
            padding: 18px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative; 
            flex-wrap: wrap; 
        }
        .info-card-header-title {
            flex-grow: 1;
            margin-right: 15px;
        }
        .header-buttons {
            display: flex;
            align-items: center;
        }
        .toggle-button, .copy-all-button {
            background-color: rgba(255,255,255,0.2); 
            border: 1px solid transparent; 
            padding: 6px 12px; 
            border-radius: 6px;
            font-size: 0.85em; 
            font-weight: 500; 
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s, color 0.2s;
            margin-left: 8px;
            white-space: nowrap;
        }
        .toggle-button:hover, .copy-all-button:hover {
            transform: scale(1.05); 
        }
        .toggle-button:active, .copy-all-button:active {
            transform: scale(0.97); 
            filter: brightness(0.95); 
        }
        .copy-all-button.copied {
        }
        .info-card-content { /* 클래스명 변경 */
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0 20px; 
            font-size: 1em;
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out, padding 0.4s ease-in-out;
            border-top: 1px solid transparent; 
            overflow-wrap: break-word; 
        }
        .info-card-content.open { /* 클래스명 변경 */
            max-height: 1000px; /* 충분한 높이, 내용 길이에 따라 조절 가능 */
            opacity: 1;
            padding: 20px; 
        }
        .info-card-content p, .info-card-content ul { /* ul에도 적용 */
            margin-bottom: 12px;
            overflow-wrap: break-word; 
        }
        .info-card-content strong { 
            opacity: 1; 
            font-weight: 600;
        }
        .info-card-content ul { 
            list-style-position: inside; /* 기본 list-style 유지하며 안쪽으로 */
            padding-left: 0; /* 기본 ul 패딩 제거 */
        }
        .info-card-content ul li { 
            padding-left: 0; /* 기존 패딩 제거 */
            text-indent: 0; /* 기존 text-indent 제거 */
            margin-bottom: 6px;
            list-style-type: disc; /* 기본 disc 사용 또는 원하는 스타일로 */
        }
        .info-card-content ul li::before { /* 사용자 정의 list-style 제거 */
            content: none;
        }
        /* 테이블 관련 CSS는 이 페이지에서 사용하지 않으므로 제거 또는 주석 처리 */
        /* .table-container, table, th, td, .risk-caution 등 ... */

        .notice {
            background-color: #FFF9DB; 
            border: 1px solid #FEEBC8; 
            border-left: 5px solid #F6E05E; 
            padding: 15px;
            margin-top: 30px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .notice strong {
            color: #D69E2E; 
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85em;
            color: #718096; 
            padding-bottom: 20px; 
        }
        .credit-info {
            margin-top: 15px;
            font-size: 0.9em; 
            color: #4b5563; 
        }

        /* "접종 후 주의사항"을 위한 커스텀 공지 스타일 */
        .vaccine-post-notice {
            background-color: #E0F2F1; /* 연한 청록색 배경 */
            border: 1px solid #A7FFEB; /* 밝은 청록색 테두리 */
            border-left: 5px solid #00BFA5; /* 진한 청록색 왼쪽 테두리 */
            padding: 15px;
            margin-top: 30px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .vaccine-post-notice h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #00796B; /* 청록색 계열 제목 */
            font-size: 1.2em;
        }
        .vaccine-post-notice p {
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .vaccine-post-notice strong {
            color: #00796B;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 id="main-title"></h1> <!-- JS에서 채움 -->

        <section id="vaccination-info-section"> <!-- ID 변경 -->
            <h2>예방접종 및 구충 안내</h2> <!-- 섹션 제목 변경 -->
            <!-- 카드 내용이 여기에 동적으로 추가됩니다 -->
        </section>

        <!-- "접종 후 주의사항"을 위한 새로운 섹션 -->
        <section id="post-vaccination-care-section" class="vaccine-post-notice">
            <!-- 내용이 여기에 동적으로 추가됩니다 -->
        </section>

        <section id="important-notice-section" class="notice">
            <h2>📌 반드시 확인하세요</h2> <!-- 섹션 제목 변경 (기존 파일 내용 활용) -->
            <div id="notice-content">
                <!-- 안내 내용이 여기에 동적으로 추가됩니다 -->
            </div>
        </section>

        <div class="footer">
            <p>본 정보는 참고용이며, 정확한 진단 및 처치는 수의사와 상담하세요.</p> <!-- 문구 약간 수정 -->
            <p class="credit-info">© 2023 묘랑묘랑 안양본점</p>
        </div>
    </div>

    <script>
        // 1. 페이지 제목
        const pageGlobalTitle = "💉 고양이 예방접종 및 기생충 예방 안내";

        // 2. 예방접종 및 구충 정보 데이터
        const vaccinationData = [
            {
                type: "🛡️ 예방접종 (기초 접종 + 부스터 백신)",
                description: 
                    "<strong>기초 접종:</strong><br>" +
                    "- 생후 6~8주부터 시작<br>" +
                    "- 3~4주 간격으로 총 3회 접종 (예: 생후 6주, 10주, 14주)<br>" +
                    "- 주요 백신: 종합백신 (범백혈구감소증, 허피스바이러스, 칼리시바이러스 포함)<br><br>" +
                    "<strong>항체가 검사:</strong><br>" +
                    "- 3차 접종 후 항체 형성 여부 확인<br>" +
                    "- 항체가가 낮을 경우, 수의사 상담을 통해 추가 접종 여부 판단<br><br>" +
                    "<strong>부스터 백신 (추가 접종):</strong><br>" +
                    "- 면역력은 시간이 지나면 감소하므로 일반적으로 연 1회 추가 접종 권장<br>" +
                    "- 종합백신 형태일 수도 있고, 필요에 따라 단일 백신 형태로 접종되기도 함<br>" +
                    "- 접종 주기 및 필요 여부는 개체의 생활환경과 건강 상태에 따라 달라질 수 있음"
            },
            {
                type: "🤧 선택 예방접종 (광견병 백신)",
                description: 
                    "- 국내 고양이에서 2004년 이후 광견병 발병 사례 없음<br>" +
                    "- 실내 생활 고양이는 접종 대상이 아닌 경우가 많음<br>" +
                    "- 다만, 해외 출국 예정이거나 야외 활동이 많은 고양이의 경우 수의사 상담 후 접종 고려"
            },
            {
                type: "🐛 구충 및 심장사상충 예방",
                description:
                    "<strong>구충제:</strong><br>" +
                    "- 실내 고양이도 구충이 필요합니다.<br>" +
                    "- 성묘는 무증상 감염 상태일 수 있어 예방 목적의 정기적인 구충이 권장됩니다.<br>" +
                    "- 구충 주기는 사용 제품에 따라 달라질 수 있으며, 제품 설명서 또는 수의사 지시에 따르는 것이 안전합니다.<br><br>" +
                    "<strong>심장사상충 예방:</strong><br>" +
                    "- 고양이는 감염 시 증상이 거의 없거나 갑작스러운 호흡기 이상, 급사 등의 위험이 있어 예방이 중요합니다.<br>" +
                    "- 치료가 어렵기 때문에 월 1회 예방제 사용이 권장됩니다.<br>" +
                    "- 예: 애드보킷(Advocate) 등은 내부(심장사상충)와 외부 기생충 모두에 효과가 있습니다.<br><br>" +
                    "<strong>🐾 묘랑묘랑 장기 이용 후 퇴실 시:</strong><br>" +
                    "- 심장사상충 및 구충 관련 처치는 보호자님께서 수의사와 상담 후 직접 진행해 주셔야 합니다.<br>" +
                    "- 예방을 위해 고양이의 건강 상태와 생활환경에 맞는 적절한 제품 및 주기를 수의사와 함께 결정해 주세요."
            }
        ];

        // 3. "위험 신호 요약" 데이터 (vaccination 페이지에서는 사용 안 함)
        // const pooRiskInfoData = []; // 주석 처리 또는 삭제

        // 4. 중요 안내사항 HTML 텍스트
        const noticeHtmlText = 
            "예방접종 주기, 구충제 투여 간격, 심장사상충 예방 방식은 고양이의 나이, 생활 환경(실내/실외), 건강 상태에 따라 달라질 수 있습니다.<br><br>" +
            "모든 예방 및 치료 계획은 <strong>수의사와의 상담을 통해 결정</strong>하는 것이 가장 정확하고 안전합니다.";

        // --- Helper Functions --- 
        function getVaccinationCardColors(typeText) { // 함수명 변경
            let bgColor = '#E3F2FD';     // 기본 카드 배경색 (Light Blue 50)
            let textColor = '#0D47A1';     // 기본 카드 텍스트 색상 (Blue 900)
            let btnBorderColor = '#64B5F6'; // 버튼 테두리 색상 (Blue 300)
            let btnHoverBgColor = '#90CAF9';// 버튼 호버 시 배경색 (Blue 200)
            let contentBorderColor = '#64B5F6'; // 내용 구분선 색상 (Blue 300)

            if (typeText.includes("예방접종")) { bgColor = '#E3F2FD'; textColor = '#0D47A1'; btnBorderColor = '#64B5F6'; btnHoverBgColor = '#90CAF9'; contentBorderColor = '#64B5F6';} // Blue
            else if (typeText.includes("선택")) { bgColor = '#E8EAF6'; textColor = '#283593'; btnBorderColor = '#7986CB'; btnHoverBgColor = '#9FA8DA'; contentBorderColor = '#7986CB';} // Indigo
            else if (typeText.includes("구충")) { bgColor = '#E0F2F1'; textColor = '#004D40'; btnBorderColor = '#4DB6AC'; btnHoverBgColor = '#80CBC4'; contentBorderColor = '#4DB6AC';} // Teal
            // "주의사항" 관련 색상 조건은 vaccinationData에서 해당 유형이 제거되었으므로, 여기서는 불필요. 
            // 다른 종류의 주의 카드가 추가될 경우를 대비해 남겨두거나, 다른 일반 색상으로 대체 가능.
            // else if (typeText.includes("주의사항")) { bgColor = '#FFF3E0'; textColor = '#E65100'; btnBorderColor = '#FFB74D'; btnHoverBgColor = '#FFCC80'; contentBorderColor = '#FFB74D';} // Orange
            
            return { bgColor, textColor, btnBorderColor, btnHoverBgColor, contentBorderColor };
        }
        
        // getRiskClass 함수는 이 페이지에서 사용하지 않음

        // --- UI Rendering Functions --- 
        function renderVaccinationCards() { // 함수명 변경
            const infoSection = document.getElementById('vaccination-info-section'); // ID 변경
            if (!infoSection) return;

            vaccinationData.forEach(info => { // vaccinationData 사용
                const card = document.createElement('div');
                card.className = 'info-card'; // CSS 클래스명 변경
                const colors = getVaccinationCardColors(info.type); // 함수 호출 변경
                card.style.backgroundColor = colors.bgColor;

                const header = document.createElement('div');
                header.className = 'info-card-header'; // CSS 클래스명 변경
                header.style.color = colors.textColor;

                const headerTitle = document.createElement('span');
                headerTitle.className = 'info-card-header-title'; // CSS 클래스명 변경
                headerTitle.innerHTML = info.type; 
                
                const headerButtons = document.createElement('div');
                headerButtons.className = 'header-buttons';

                const copyAllBtn = document.createElement('button');
                copyAllBtn.className = 'copy-all-button';
                copyAllBtn.textContent = '전체 복사';
                copyAllBtn.style.color = colors.textColor;
                copyAllBtn.style.borderColor = colors.btnBorderColor;
                copyAllBtn.addEventListener('mouseover', () => { 
                    copyAllBtn.style.backgroundColor = colors.btnHoverBgColor;
                    copyAllBtn.style.borderColor = colors.textColor; 
                });
                copyAllBtn.addEventListener('mouseout', () => { 
                    copyAllBtn.style.backgroundColor = 'rgba(255,255,255,0.2)'; 
                    copyAllBtn.style.borderColor = colors.btnBorderColor;
                });

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'toggle-button';
                toggleBtn.textContent = '더보기';
                toggleBtn.style.color = colors.textColor;
                toggleBtn.style.borderColor = colors.btnBorderColor;
                toggleBtn.addEventListener('mouseover', () => { 
                    toggleBtn.style.backgroundColor = colors.btnHoverBgColor; 
                    toggleBtn.style.borderColor = colors.textColor;
                });
                toggleBtn.addEventListener('mouseout', () => { 
                    toggleBtn.style.backgroundColor = 'rgba(255,255,255,0.2)';
                    toggleBtn.style.borderColor = colors.btnBorderColor;
                });

                headerButtons.appendChild(copyAllBtn);
                headerButtons.appendChild(toggleBtn);

                header.appendChild(headerTitle);
                header.appendChild(headerButtons);
                
                const content = document.createElement('div');
                content.className = 'info-card-content'; // CSS 클래스명 변경
                content.style.color = colors.textColor; 
                
                // 백신 정보는 주로 설명이므로, cause/action/precaution 대신 description을 바로 사용
                // strong 태그는 description 내부에 이미 포함되어 있다고 가정
                content.innerHTML = `<p>${info.description.replace(/<br>/g, '</p><p>')}</p>`; // <br>을 p태그로 분리하여 단락 유지
                // description 내부의 ul li 를 제대로 표시하기 위한 추가 처리 필요할 수 있음.
                // 여기서는 우선 <p>로 감싸고, 내용에 따라 추가 스타일링 또는 파싱 조정.
                // ul, li 태그가 description에 직접 포함되어 있다면, content.innerHTML = info.description; 으로도 가능

                card.appendChild(header);
                card.appendChild(content);
                infoSection.appendChild(card); 

                const toggleContent = () => {
                    const isDisplayed = content.classList.contains('open');
                    if (isDisplayed) {
                        content.classList.remove('open');
                        toggleBtn.textContent = '더보기';
                    } else {
                        content.classList.add('open');
                        content.style.borderTopColor = colors.contentBorderColor; 
                        toggleBtn.textContent = '간략히';
                    }
                };

                header.addEventListener('click', (e) => {
                    if (e.target.closest('.header-buttons')) return;
                    toggleContent();
                });
                
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleContent();
                });

                copyAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 복사할 텍스트: 제목 + 설명 (HTML 태그 제거 및 줄바꿈 처리)
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = info.description;
                    const plainDescription = tempDiv.textContent || tempDiv.innerText || "";
                    
                    const textToCopy = 
`${info.type.replace(/<\/?b>/gi, '')} \n\n` +
`${plainDescription.replace(/\n\s*\n/g, '\n')}`; // 연속된 빈 줄 제거

                    navigator.clipboard.writeText(textToCopy).then(() => {
                        const originalText = copyAllBtn.textContent;
                        copyAllBtn.textContent = '복사 완료!';
                        copyAllBtn.style.backgroundColor = colors.btnHoverBgColor; 
                        copyAllBtn.style.color = colors.bgColor; 
                        setTimeout(() => {
                            copyAllBtn.textContent = originalText;
                            copyAllBtn.style.backgroundColor = 'rgba(255,255,255,0.2)'; 
                            copyAllBtn.style.color = colors.textColor; 
                        }, 1500);
                    }).catch(err => {
                        console.error('전체 복사 실패:', err);
                        alert('클립보드 전체 복사에 실패했습니다. 잠시 후 다시 시도해주세요.');
                    });
                });
            });
        }

        // renderPooRiskTable 함수는 이 페이지에서 사용하지 않음

        function renderPostVaccinationCareInfo() {
            const section = document.getElementById('post-vaccination-care-section');
            if (!section) return;

            const title = "💉 접종 후 관리사항";
            const content = 
                "<p>- 접종 후 2~3주간은 면역 형성 기간입니다. 이 기간 동안 가정에서 고양이의 건강 상태를 충분히 관찰해주세요.</p>" +
                "<p>- 면역력이 완전히 형성되지 않은 시기이므로, 이 기간 동안 고양이 호텔 이용은 제한될 수 있습니다. 양해 부탁드립니다.</p>";

            section.innerHTML = `<h3>${title}</h3>${content}`;
        }

        function renderNotice() {
            const noticeContent = document.getElementById('notice-content');
            if (noticeContent) {
                noticeContent.innerHTML = noticeHtmlText;
            }
        }

        // --- Initialize Page --- 
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('main-title').textContent = pageGlobalTitle;
            renderVaccinationCards(); 
            renderPostVaccinationCareInfo(); // 새로운 함수 호출 추가
            renderNotice();
        });
    </script>
</body>
</html>
